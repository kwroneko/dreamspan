name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run size
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag rp-harness:ci .
      # The image listens on 0.0.0.0, so with no exposure settings it must refuse to start.
      - name: Refuse to start beyond loopback without exposure settings
        run: |
          code=0
          timeout 60 docker run --name rp-harness-ci-unsafe rp-harness:ci > unsafe.log 2>&1 || code=$?
          cat unsafe.log
          echo "exit: $code"
          [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && grep -q UnsafeExposure unsafe.log
      # With an exposure setting (an admin password) it starts. A non-default PORT checks
      # that the health check follows it.
      - name: Run the image until it reports healthy
        run: |
          docker run --detach --name rp-harness-ci --health-interval 2s -e ADMIN_PASSWORD=ci-admin-password -e PORT=3000 rp-harness:ci
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' rp-harness-ci)
            if [ "$status" = healthy ] || [ "$(docker inspect --format '{{.State.Running}}' rp-harness-ci)" != true ]; then break; fi
            sleep 2
          done
          docker logs rp-harness-ci
          echo "health: $status"
          [ "$status" = healthy ]
      - if: always()
        run: docker rm --force --volumes rp-harness-ci rp-harness-ci-unsafe || true
