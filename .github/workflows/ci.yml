name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run size
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm test
      - run: npm run test:slow
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/@playwright/test/cli.js install --with-deps --only-shell chromium
      - run: npm run test:browser
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/client/test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag dreamspan:ci .
      # The image listens on 0.0.0.0, so with no exposure settings it must refuse to start.
      - name: Refuse to start beyond loopback without exposure settings
        run: |
          code=0
          timeout 60 docker run --name dreamspan-ci-unsafe dreamspan:ci > unsafe.log 2>&1 || code=$?
          cat unsafe.log
          echo "exit: $code"
          [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && grep -q UnsafeExposure unsafe.log
      # With an exposure setting (an admin password) it starts. A non-default PORT checks
      # that the health check follows it.
      - name: Run the image until it reports healthy
        run: |
          docker run --detach --name dreamspan-ci --health-interval 2s -e ADMIN_PASSWORD=ci-admin-password -e PORT=3000 dreamspan:ci
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' dreamspan-ci)
            if [ "$status" = healthy ] || [ "$(docker inspect --format '{{.State.Running}}' dreamspan-ci)" != true ]; then break; fi
            sleep 2
          done
          docker logs dreamspan-ci
          echo "health: $status"
          [ "$status" = healthy ]
      - if: always()
        run: docker rm --force --volumes dreamspan-ci dreamspan-ci-unsafe || true
