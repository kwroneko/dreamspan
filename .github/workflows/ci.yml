name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIMALLOC_ALLOW_THP: "0"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run size
      - run: npm run check:released-migrations
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [1/4, 2/4, 3/4, 4/4, slow]
    env:
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Enable PID namespaces for the test runner's unshare
        run: |
          args=(--user --map-current-user --pid --fork --kill-child -- /bin/true)
          if unshare "${args[@]}"; then exit 0; fi

          # Give the test executable a profile on AppArmor runners that restrict user namespaces.
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          ci_bin=/usr/local/lib/dreamspan-ci
          sudo install -D -m 0755 "$(command -v unshare)" "$ci_bin/unshare"
          sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          profile dreamspan-ci-unshare /usr/local/lib/dreamspan-ci/unshare flags=(unconfined) {
            userns,
          }
          PROFILE
          "$ci_bin/unshare" "${args[@]}"
          echo "$ci_bin" >> "$GITHUB_PATH"
      - run: npm ci
      - if: matrix.suite != 'slow'
        run: npm test -- --shard=${{ matrix.suite }}
      - if: matrix.suite == 'slow'
        run: npm run test:slow

  check:
    runs-on: ubuntu-latest
    needs: [static, test]
    if: always()
    steps:
      - run: test "${{ needs.static.result }}" = success && test "${{ needs.test.result }}" = success

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      PLAYWRIGHT_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Persistent contexts use full Chromium. The other tests use the headless shell.
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Set the browser layout tests' system font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-freefont-otf
          mkdir -p ~/.config/fontconfig/conf.d
          cat > ~/.config/fontconfig/conf.d/99-dreamspan-ci.conf <<'FONTCONFIG'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>sans-serif</family><prefer><family>FreeSans</family></prefer></alias>
            <alias binding="strong"><family>system-ui</family><prefer><family>FreeSans</family></prefer></alias>
          </fontconfig>
          FONTCONFIG
          test "$(fc-match -f '%{family}' system-ui)" = FreeSans
      - run: npm run build
      - run: npx playwright test -c packages/client/playwright.config.ts --project=chromium --shard=${{ matrix.shard }}/6
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: packages/client/test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag dreamspan:ci .
      # The image listens on 0.0.0.0, so with no exposure settings it must refuse to start.
      - name: Refuse to start beyond loopback without exposure settings
        run: |
          code=0
          timeout 60 docker run --name dreamspan-ci-unsafe dreamspan:ci > unsafe.log 2>&1 || code=$?
          cat unsafe.log
          echo "exit: $code"
          [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && grep -q UnsafeExposure unsafe.log
      # With an exposure setting (an admin password) it starts. A non-default PORT checks
      # that the health check follows it.
      - name: Run the image until it reports healthy
        run: |
          docker run --detach --name dreamspan-ci --health-interval 2s -e ADMIN_PASSWORD=ci-admin-password -e PORT=3000 dreamspan:ci
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' dreamspan-ci)
            if [ "$status" = healthy ] || [ "$(docker inspect --format '{{.State.Running}}' dreamspan-ci)" != true ]; then break; fi
            sleep 2
          done
          docker logs dreamspan-ci
          echo "health: $status"
          [ "$status" = healthy ]
      - if: always()
        run: docker rm --force --volumes dreamspan-ci dreamspan-ci-unsafe || true
